<!DOCTYPE html>
<html>
<head>
    <title>Delloite Job Application Form</title>
    <link rel="stylesheet" type="text/css" href="form.css">
</head>

<body>

    <h1>Delloite Job Application Form</h1>

    <form>

        <!-- First Name -->
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
        <br><br>

        <!-- Last Name -->
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- Phone -->
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <!-- College Name -->
        <label for="college">College Name:</label>
        <input type="text" id="college" name="college" required>
        <br><br>

        <!-- State -->
        <label for="state">State:</label>
        <select id="state" name="state" required>
            <option value="">-- Select State --</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Telangana">Telangana</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Kerala">Kerala</option>
        </select>
        <br><br>

        <!-- Address -->
        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" rows="5" cols="40"></textarea>
        <br><br>

        <!-- Skills -->
        <label>Skills:</label>
        <br>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>
        <br>

        <input type="checkbox" id="springboot" name="skills" value="Spring Boot">
        <label for="springboot">Spring Boot</label>
        <br>

        <input type="checkbox" id="api" name="skills" value="API Integration">
        <label for="api">API Integration</label>
        <br>

        <input type="checkbox" id="postman" name="skills" value="Postman">
        <label for="postman">Postman</label>
        <br>

        <input type="checkbox" id="sql" name="skills" value="SQL">
        <label for="sql">SQL</label>
        <br>

        <input type="checkbox" id="mysql" name="skills" value="MySQL">
        <label for="mysql">MySQL</label>
        <br>

        <input type="checkbox" id="react" name="skills" value="React">
        <label for="react">React</label>
        <br><br>

        <!-- Languages -->
        <label>Languages:</label>
        <br>

        <input type="checkbox" id="english" name="language" value="English">
        <label for="english">English</label>
        <br>

        <input type="checkbox" id="telugu" name="language" value="Telugu">
        <label for="telugu">Telugu</label>
        <br>

        <input type="checkbox" id="kannada" name="language" value="Kannada">
        <label for="kannada">Kannada</label>
        <br>

        <input type="checkbox" id="hindi" name="language" value="Hindi">
        <label for="hindi">Hindi</label>
        <br><br>

        <!-- Resume -->
        <label for="resume">Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
        <br><br>

        <!-- Submit and Reset -->
        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
