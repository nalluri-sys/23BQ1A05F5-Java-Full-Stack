<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2-T8WRNCbMfn1VG8vs58NV5TMyD701wQ6b2Y_j5h_zg&s=10" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="logo" href="index.html">Prep<span>Shelf</span></a>
            <div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="cart.html">Cart</a></div>
            <div class="nav-actions"><a class="cart-link" href="login.html">Log in</a><a class="button active" href="register.html">Register</a></div>
        </nav>
    </header>
    <main class="auth-page">
        <div class="container auth-layout">
            <div class="auth-intro"><span class="eyebrow">Start prepared</span><h1>Make your next chapter count.</h1><p>Create your free account and keep every exam essential in one place.</p></div>
            <form class="form-card" action="#" method="post">
                <h2>Create account</h2><p>Join learners building their best study shelf.</p>
                <div class="form-group"><label for="name">Full name</label><input type="text" id="name" name="name" placeholder="Your full name" required></div>
                <div class="form-group"><label for="email">Email address</label><input type="email" id="email" name="email" placeholder="you@example.com" required></div>
                <div class="form-group"><label for="password">Create password</label><input type="password" id="password" name="password" placeholder="At least 8 characters" required></div>
                <button class="button" type="submit">Create account</button>
                <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
            </form>
        </div>
    </main>
    <footer class="site-footer"><div class="container footer-content"><span>© 2025 PrepShelf</span><span>Built for focused learners.</span></div></footer>
</body>
</html>
