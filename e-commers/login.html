<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2-T8WRNCbMfn1VG8vs58NV5TMyD701wQ6b2Y_j5h_zg&s=10" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="logo" href="index.html">Prep<span>Shelf</span></a>
            <div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="cart.html">Cart</a></div>
            <div class="nav-actions"><a class="cart-link active" href="login.html">Log in</a><a class="button" href="register.html">Register</a></div>
        </nav>
    </header>
    <main class="auth-page">
        <div class="container auth-layout">
            <div class="auth-intro"><span class="eyebrow">Welcome back</span><h1>Keep your study momentum.</h1><p>Sign in to revisit your saved shelf and keep your preparation moving.</p></div>
            <form class="form-card" action="#" method="post" data-login-form>
                <h2>Log in</h2><p>Enter your PrepShelf account details.</p>
                <div class="form-group"><label for="email">Email address</label><input type="email" id="email" name="email" placeholder="you@example.com" required></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Enter your password" required></div>
                <button class="button" type="submit">Log in</button>
                <p class="form-footer">New to PrepShelf? <a href="register.html">Create an account</a></p>
            </form>
        </div>
    </main>
    <footer class="site-footer"><div class="container footer-content"><span>© 2025 PrepShelf</span><span>Built for focused learners.</span></div></footer>
</body>
</html>
